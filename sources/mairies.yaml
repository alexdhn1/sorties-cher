# Sources municipales vérifiées (recensement 2026-08-01) — lues par la tâche hebdo.
# priorite: 1 = brancher d'abord (rendement), 2 = complément, 3 = appoint faible rendement.
# mode: rss = flux exploitable directement ; html = extraction sur la page ; rss-js = RSS ok mais pages JS.

