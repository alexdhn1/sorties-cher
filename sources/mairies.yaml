# --- Pistes non branchées ---
# OT Autour de Chenonceaux (https://autourdechenonceaux.fr/agenda/) : agenda rendu côté client,
#   filtres "Brocante et vide-greniers" — identifier l'API sous-jacente (Apidae/Tourinsoft) via
#   l'onglet réseau d'un navigateur. Priorité d'investigation n°1.
# PanneauPocket (app.panneaupocket.com) : LE canal commun du secteur, y compris Saint-Georges-sur-Cher
#   (dont le site est mort : agenda vide, actus 404). App JS — nécessite navigateur. Priorité n°2.
# Pontlevoy & Chisseaux : sites actifs mais certificat TLS invalide — récupérables avec verify désactivé
#   (décision à prendre : accepter le risque TLS pour deux mairies ou attendre qu'elles réparent).
# Sans source : Angé (site périmé 2024), Chissay (HTTP 500), Vallières-les-Grandes (IntraMuros only),
#   Civray-de-Touraine (agenda figé 2025).
